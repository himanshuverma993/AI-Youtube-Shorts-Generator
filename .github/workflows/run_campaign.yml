name: Run clipping campaign

# Runs the ENTIRE pipeline on free GitHub-hosted runners — no VPS, no SSH,
# no credit card. Rendered .mp4s + metadata JSON land in the run's Artifacts
# panel so you can download and post them anywhere.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL to clip (leave empty to batch-process campaign/urls.txt)"
        required: false
        type: string
      num_clips:
        description: "Shorts to render per video"
        required: false
        default: "3"
      aspect_ratio:
        description: "Output aspect ratio"
        required: false
        default: "9:16"
        type: choice
        options:
          - "9:16"
          - "1:1"
          - "4:5"
      language:
        description: "Force Whisper language (e.g. en); empty = auto-detect"
        required: false
        type: string
  schedule:
    - cron: '0 0,6,12,18 * * *'   # 4x/day: 00:00, 06:00, 12:00, 18:00 UTC

permissions:
  # contents:write is required ONLY when Instagram auto-upload is enabled —
  # IG's container API needs a public media URL, so clips are staged as a
  # GitHub Release asset in this repo (tag: media-staging) and deleted after
  # publishing. Without IG upload enabled nothing is written back.
  contents: write

concurrency:
  group: run-campaign
  cancel-in-progress: false   # never let two cron runs double-process the same URLs

env:
  # secrets may not be referenced in step-level `if:` — mirror to env instead.
  YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
  # Optional yt-dlp InnerTube client pin, e.g. "tv,web_safari". Empty = the
  # built-in rotation in shorts_generator/local/downloader.py, which retries a
  # bot-checked download under alternate clients before giving up. Job-level so
  # the diagnostics step can report it too.
  YTDLP_PLAYER_CLIENTS: ${{ vars.YTDLP_PLAYER_CLIENTS }}

jobs:
  clip:
    runs-on: ubuntu-latest
    # 240 min: pinned-local runs (WHISPER/LLM_PROVIDER=local) process a 2h
    # podcast entirely on CPU — roughly 2× the cloud-first wall-clock time.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: mkdir -p output campaign

      - name: Restore campaign state (ledgers + transcript caches)
        # Keeps the 4x/day cron runs from re-processing finished URLs, from
        # re-spending Groq Whisper quota on already-transcribed sources, and
        # from hammering permanently-failing URLs beyond their 3 strikes.
        #
        # restore/save are SPLIT on purpose. The old combined actions/cache@v4
        # only saves in a post-step that GitHub skips once an earlier step
        # fails (`save-always: false`), so run 36494468151 discarded everything
        # it had learned — no "Cache saved with key" line appears in that log.
        # The matching save step at the end of the job runs with `if: always()`.
        id: campaign-state
        uses: actions/cache/restore@v4
        with:
          path: |
            campaign/processed_urls.txt
            campaign/failed_urls.txt
            campaign/posting_registry.json
            campaign/feedback_stats.json
            campaign/upload_queue.json
            campaign/upload_ledger.json
            campaign/ig_upload_queue.json
            campaign/ig_token.json
            output/*.srt
            output/trend_context.json
            # Clips sitting in the upload queues are referenced by file PATH —
            # the runner disk is ephemeral, so persist the queued .mp4 files
            # too or the next cron tick finds only missing files (audit F8).
            output/campaign_*/video_*/short_*.mp4
          key: campaign-state-${{ github.run_id }}
          restore-keys: |
            campaign-state-

      - name: Restore tier-3 local model weights (llama.cpp + faster-whisper)
        # The doomsday backends download ~2GB of GGUF weights once; a STICKY
        # static key means later runs reuse them instead of re-downloading.
        # Bump the -v1 suffix if LOCAL_LLM_REPO/FILE defaults ever change.
        # Split restore/save for the same reason as the campaign state: the
        # combined action's post-step is skipped when a later step fails, so a
        # run that downloaded 2GB and then died threw all of it away.
        id: model-weights
        uses: actions/cache/restore@v4
        with:
          path: models
          key: local-model-weights-v1

      - name: Decode optional YouTube cookies for yt-dlp
        # Only needed if YouTube bot-checks the runner's datacenter IP.
        if: ${{ env.YT_COOKIES_B64 != '' }}
        run: |
          echo "${YT_COOKIES_B64}" | base64 -d > "$RUNNER_TEMP/yt_cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"
          echo "YouTube cookies decoded — yt-dlp will run authenticated."

      - name: Generate clips
        # 210 min inside the 240-min job window: pinned-local runs (CPU-only
        # whisper + LLM) can take ~2× the cloud-first time (audit F10).
        timeout-minutes: 210
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional LLM failover — if unset, the pipeline runs Groq + local tier-3.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Route ALL local model downloads (whisper fallback + tier-3 GGUF)
          # into models/ so the cache block above persists them between runs.
          HF_HOME: models/hf
          # On/off switches live in repo Variables (Settings → Secrets and
          # variables → Actions → Variables tab) so the operator never edits
          # this file. Codes default to SAFE states when the variable is unset.
          UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED || 'false' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          IG_UPLOAD_ENABLED: ${{ vars.IG_UPLOAD_ENABLED || 'false' }}
          CAMPAIGN_NICHE: ${{ vars.CAMPAIGN_NICHE }}
          # 100%-local sovereignty mode: set either to "local" to guarantee
          # that backend never touches a cloud API (default 'auto' unchanged).
          WHISPER_PROVIDER: ${{ vars.WHISPER_PROVIDER || 'auto' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          # Optional feedback loop (Phase 2) — inactive until all 3 are set;
          # created once via scripts/oauth_local_setup.py. FREE read-only
          # YouTube Analytics, no billing needed.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional Instagram upload + insights (Phase 4) — off until seeded.
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.url }}
          NUM_CLIPS: ${{ github.event.inputs.num_clips }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          set -e
          ARGS=(--num-clips "${NUM_CLIPS:-3}" --aspect-ratio "${ASPECT_RATIO:-9:16}")
          if [ -n "${LANGUAGE:-}" ]; then
            ARGS+=(--language "${LANGUAGE}")
          fi

          if [ -n "${INPUT_URL:-}" ]; then
            echo "▶ Manual dispatch — clipping: ${INPUT_URL}"
            python main.py "${INPUT_URL}" "${ARGS[@]}" --output-json output/result.json
          else
            echo "▶ Batch mode — processing new URLs from campaign/urls.txt"
            python campaign_runner.py --urls-file campaign/urls.txt "${ARGS[@]}"
          fi

      - name: Collect diagnostics
        # Runs even when "Generate clips" fails. The 2026-09-28 live test
        # (run 36494468151) died on a yt-dlp bot check and produced ZERO
        # artifacts, because the upload step below is skipped on failure by
        # default — so triage needed the raw runner logs. This step plus the
        # `if: always()` on the upload guarantee the Artifacts panel always
        # carries the campaign summary and the toolchain versions.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/diagnostics
          {
            echo "run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} event=${GITHUB_EVENT_NAME}"
            echo "collected_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_OS} image=${ImageOS:-unknown}"
            echo "python=$(python -V 2>&1)"
            echo "yt_dlp=$(python -m yt_dlp --version 2>&1 | tail -1)"
            echo "ffmpeg=$(ffmpeg -version 2>/dev/null | head -1)"
            echo "cookies_configured=$([ -n "${YTDLP_COOKIES_FILE:-}" ] && echo yes || echo no)"
            echo "player_clients=${YTDLP_PLAYER_CLIENTS:-<default rotation>}"
          } > output/diagnostics/environment.txt
          for f in campaign/failed_urls.txt campaign/processed_urls.txt; do
            [ -f "$f" ] && cp "$f" output/diagnostics/ || true
          done
          find output -maxdepth 3 -type f \
            \( -name 'summary.json' -o -name 'result_*.json' -o -name 'short_*.mp4' \) \
            > output/diagnostics/manifest.txt 2>/dev/null || true
          echo "--- diagnostics ---"
          cat output/diagnostics/environment.txt

      - name: Save tier-3 local model weights
        # Only when the restore missed — the key is static, so re-saving an
        # existing entry would just warn "cache already exists" every run.
        if: always() && steps.model-weights.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: models
          key: local-model-weights-v1

      - name: Save campaign state (ledgers + transcript caches)
        # `always()` is the whole point: a run that dies mid-way has still
        # earned its transcript caches and ledger updates, and throwing them
        # away means the next tick re-spends Groq quota from scratch.
        # campaign_runner only strikes a URL for CONTENT failures, so a
        # bot-check/outage persisted here cannot retire a good video.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            campaign/processed_urls.txt
            campaign/failed_urls.txt
            campaign/posting_registry.json
            campaign/feedback_stats.json
            campaign/upload_queue.json
            campaign/upload_ledger.json
            campaign/ig_upload_queue.json
            campaign/ig_token.json
            output/*.srt
            output/trend_context.json
            output/campaign_*/video_*/short_*.mp4
          key: campaign-state-${{ github.run_id }}

      - name: Upload clips + metadata JSON
        # `always()` so a FAILED run still ships summary.json + diagnostics —
        # without it a red run leaves nothing to download and the only
        # evidence is the ephemeral runner log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/short_*.mp4
            output/result.json
            output/campaign_*/
            output/diagnostics/
